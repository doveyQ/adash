version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "dashboard"

  - package-ecosystem: "pip"
    directory: "/agent"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "agent"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
