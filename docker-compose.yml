services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: adash
      POSTGRES_PASSWORD: ***REMOVED***
      POSTGRES_DB: adash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adash"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard/src:/app/src
    environment:
      DATABASE_URL: postgresql://adash:***REMOVED***@postgres:5432/adash
      API_KEY: ***REMOVED***
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
